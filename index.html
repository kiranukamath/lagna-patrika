<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiran &amp; Pavitra are Getting Married!</title>

<!--
  IMPORTANT: These Open Graph tags control the WhatsApp / iMessage / social
  link-preview card. They MUST stay as plain static HTML (link-preview bots
  do not run JavaScript), so if you edit config.js, mirror the relevant
  details here too: title, description, date, and the og:image below.
  og:image must be an ABSOLUTE url once deployed (e.g.
  https://<user>.github.io/lagna-patrika/assets/og-image.png).
-->
<meta property="og:type" content="website" />
<meta property="og:title" content="Kiran &amp; Pavitra are Getting Married!" />
<meta property="og:description" content="Save the date — Thursday, 26th November 2026 in Kumta. We can't wait to celebrate with you!" />
<meta property="og:image" content="https://kiranukamath.github.io/lagna-patrika/assets/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:url" content="https://kiranukamath.github.io/lagna-patrika/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Kiran &amp; Pavitra are Getting Married!" />
<meta name="twitter:description" content="Save the date — Thursday, 26th November 2026 in Kumta. We can't wait to celebrate with you!" />
<meta name="twitter:image" content="https://kiranukamath.github.io/lagna-patrika/assets/og-image.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="page">

  <section class="hero">
    <!-- mandala corner flourishes (decorative, css-positioned) -->
    <svg class="mandala mandala-left" viewBox="0 0 100 100" aria-hidden="true">
      <g class="mandala-ring">
        <circle cx="50" cy="50" r="16"/><circle cx="50" cy="32.9" r="16"/><circle cx="65.6" cy="41.4" r="16"/>
        <circle cx="65.6" cy="58.6" r="16"/><circle cx="50" cy="67.1" r="16"/><circle cx="34.4" cy="58.6" r="16"/><circle cx="34.4" cy="41.4" r="16"/>
      </g>
    </svg>
    <svg class="mandala mandala-right" viewBox="0 0 100 100" aria-hidden="true">
      <g class="mandala-ring">
        <circle cx="50" cy="50" r="16"/><circle cx="50" cy="32.9" r="16"/><circle cx="65.6" cy="41.4" r="16"/>
        <circle cx="65.6" cy="58.6" r="16"/><circle cx="50" cy="67.1" r="16"/><circle cx="34.4" cy="58.6" r="16"/><circle cx="34.4" cy="41.4" r="16"/>
      </g>
    </svg>

    <div class="hero-inner">
      <p class="om-mark">ॐ</p>
      <p class="eyebrow">Shubh Vivah &middot; We're Getting Married</p>
      <div class="couple-block">
        <div class="person">
          <h1 class="person-name" id="name1"></h1>
          <p class="person-parents" id="parents1"></p>
        </div>
        <span class="amp">&amp;</span>
        <div class="person">
          <h1 class="person-name" id="name2"></h1>
          <p class="person-parents" id="parents2"></p>
        </div>
      </div>
      <p class="tagline" id="tagline"></p>
      <p class="intro" id="intro-line"></p>

      <div id="countdown" class="countdown" aria-live="polite">
        <div class="cd-block"><span id="cd-days">--</span><small>Days</small></div>
        <div class="cd-block"><span id="cd-hours">--</span><small>Hours</small></div>
        <div class="cd-block"><span id="cd-minutes">--</span><small>Minutes</small></div>
        <div class="cd-block"><span id="cd-seconds">--</span><small>Seconds</small></div>
      </div>
      <p id="countdown-over" class="countdown-over hidden">🎉 It's the big day — see you there! 🎉</p>

      <p class="hero-date" id="date-display"></p>
    </div>
    <div class="hero-wave"></div>
  </section>

  <section class="panel details reveal">
    <h2 class="panel-title">The Details</h2>
    <div class="detail-row">
      <span class="detail-icon icon-calendar" aria-hidden="true"></span>
      <span id="detail-date"></span>
    </div>
    <div class="detail-row">
      <span class="detail-icon icon-clock" aria-hidden="true"></span>
      <span id="detail-time"></span>
    </div>
    <div class="detail-row">
      <span class="detail-icon icon-pin" aria-hidden="true"></span>
      <span id="detail-venue"></span>
    </div>

    <div class="cal-buttons">
      <a id="cal-google" class="btn-mini" target="_blank" rel="noopener">+ Add to Google Calendar</a>
      <button id="cal-ics" class="btn-mini">+ Download .ics</button>
    </div>
  </section>

  <div class="divider" aria-hidden="true"><span></span><i class="petal"></i><span></span></div>

  <section class="panel venue-panel reveal">
    <h2 class="panel-title">Venue</h2>
    <p class="venue-name" id="venue-name"></p>
    <p class="venue-address" id="venue-address"></p>
    <div class="venue-row">
      <img id="venue-qr" class="qr" alt="Scan for venue location on Google Maps" />
      <a id="venue-maps-link" class="btn" target="_blank" rel="noopener">Get Directions →</a>
    </div>
  </section>

  <div class="divider" aria-hidden="true"><span></span><i class="petal"></i><span></span></div>

  <section class="panel photo-share reveal" id="photo-share-section">
    <h2 class="panel-title" id="photo-heading"></h2>
    <p id="photo-body"></p>
    <a id="photo-link" class="btn" target="_blank" rel="noopener"></a>
    <p class="hashtag" id="hashtag"></p>
  </section>

  <footer class="footer reveal">
    <p id="family-note"></p>
    <p class="footer-heart">🪔</p>
  </footer>

</div>

<script src="config.js"></script>
<script src="assets/script.js"></script>
</body>
</html>
